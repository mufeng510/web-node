name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  workflows: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production

      - name: Generate OpenAPI spec
        run: bun run openapi:generate

      - name: Generate types
        run: bun run types:generate

      - name: Create FNOS package
        run: bun run fnos:package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            # Auto-calculate from conventional commits
            VERSION=$(bun run scripts/calculate-version.ts)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/web-note:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/web-note:latest
          labels: |
            org.opencontainers.image.title=Web Note
            org.opencontainers.image.description=Browser-first, Self-hosted, Markdown-first, Obsidian-compatible, AI-native personal knowledge base
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Web Note ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/fnos/manifest.json
            dist/fnos/docker-compose.yml
            dist/fnos/README.md

      - name: Update latest tag
        run: |
          git tag -f latest ${{ steps.version.outputs.version }}
          git push -f origin latest