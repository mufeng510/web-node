name: Documentation Consistency

on:
  pull_request:
    paths:
      - 'README.md'
      - 'README.zh-CN.md'
      - 'website/**'
      - 'src/**'
      - '.github/workflows/docs.yml'

jobs:
  docs-check:
    name: Check Documentation Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check README consistency
        run: |
          # Check if README.md and README.zh-CN.md have same structure
          bun run scripts/check-docs-consistency.ts

      - name: Check website consistency
        run: |
          # Check if website docs match README
          bun run scripts/check-website-consistency.ts

      - name: Validate OpenAPI spec
        run: |
          bun run openapi:generate
          # Validate against OpenAPI spec
          bunx @redocly/openapi-cli lint openapi.json