version: '3.8'

services:
  webnote:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/web-note:${VERSION:-latest}
    container_name: webnote
    ports:
      - "8080:8080"
    volumes:
      - /volume1/docker/webnote/data:/data
      - /volume1/docker/webnote/app-data:/app-data
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATA_ROOT=/data
      - APP_DATA_ROOT=/app-data
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - DATABASE_URL=file:/app-data/webnote.db
      - TZ=${TZ:-Asia/Shanghai}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "fnos.name=Web Note"
      - "fnos.description=Browser-first, Self-hosted, Markdown-first, Obsidian-compatible, AI-native personal knowledge base"
      - "fnos.icon=https://raw.githubusercontent.com/${GITHUB_REPOSITORY_OWNER}/web-note/main/public/icon.png"
      - "fnos.category=productivity"
      - "fnos.version=${VERSION:-latest}"
      - "fnos.port=8080"
      - "fnos.volume.data=/data"
      - "fnos.volume.app-data=/app-data"

networks:
  default:
    name: fnos-network
    external: true